<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DualSense Gyroscope Wireframe</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#050505;
    font-family:Arial;
    color:white;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:20px;
    left:20px;
    width:340px;

    background:rgba(0,0,0,0.5);
    border:1px solid #222;

    border-radius:20px;

    padding:20px;

    backdrop-filter:blur(20px);

    z-index:10;
}

#title{
    font-size:28px;
    color:#4da6ff;
    margin-bottom:15px;
    font-weight:bold;
}

button{
    width:100%;
    height:52px;

    border:none;
    border-radius:12px;

    background:#1677ff;
    color:white;

    font-size:18px;

    cursor:pointer;
}

#status{
    margin-top:15px;
    color:#999;
    line-height:1.5;
}

.bar{
    width:100%;
    height:14px;

    background:#111;

    border-radius:999px;

    overflow:hidden;

    margin-top:8px;
}

.fill{
    height:100%;
    width:0%;
    background:#4da6ff;
}

.label{
    margin-top:15px;
    color:#4da6ff;
}

</style>
</head>
<body>

<div id="ui">

    <div id="title">
        🎮 DualSense Gyro
    </div>

    <button id="connectBtn">
        Connecter la manette
    </button>

    <div id="status">
        Aucune manette connectée
    </div>

    <div class="label">L2</div>
    <div class="bar">
        <div id="l2Fill" class="fill"></div>
    </div>

    <div class="label">R2</div>
    <div class="bar">
        <div id="r2Fill" class="fill"></div>
    </div>

</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";

////////////////////////////////////////////////////////////////////////////////
// THREE
////////////////////////////////////////////////////////////////////////////////

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.z = 7;

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

document.body.appendChild(renderer.domElement);

////////////////////////////////////////////////////////////////////////////////
// LIGHT
////////////////////////////////////////////////////////////////////////////////

const light = new THREE.PointLight(0xffffff,3);

light.position.set(5,5,5);

scene.add(light);

////////////////////////////////////////////////////////////////////////////////
// CONTROLLER
////////////////////////////////////////////////////////////////////////////////

const controller = new THREE.Group();

scene.add(controller);

////////////////////////////////////////////////////////////////////////////////
// MATERIAL
////////////////////////////////////////////////////////////////////////////////

const wireMat = new THREE.MeshBasicMaterial({
    color:0x4da6ff,
    wireframe:true
});

////////////////////////////////////////////////////////////////////////////////
// BODY
////////////////////////////////////////////////////////////////////////////////

const body = new THREE.Mesh(
    new THREE.BoxGeometry(3.3,1.2,1),
    wireMat
);

controller.add(body);

////////////////////////////////////////////////////////////////////////////////
// HANDLES
////////////////////////////////////////////////////////////////////////////////

function createHandle(x, rot){

    const handle = new THREE.Mesh(
        new THREE.CylinderGeometry(0.35,0.55,1.9,16),
        wireMat
    );

    handle.rotation.z = rot;

    handle.position.set(x,-1,0);

    controller.add(handle);
}

createHandle(-1.25,-0.5);
createHandle(1.25,0.5);

////////////////////////////////////////////////////////////////////////////////
// BUTTONS
////////////////////////////////////////////////////////////////////////////////

const buttons = {};

function createButton(name, x, y){

    const btn = new THREE.Mesh(
        new THREE.CylinderGeometry(0.13,0.13,0.08,16),
        new THREE.MeshBasicMaterial({
            color:0xffffff,
            wireframe:true
        })
    );

    btn.rotation.x = Math.PI/2;

    btn.position.set(x,y,0.55);

    controller.add(btn);

    buttons[name] = btn;
}

createButton("cross",1.2,-0.05);
createButton("circle",1.45,0.2);
createButton("square",0.95,0.2);
createButton("triangle",1.2,0.45);

////////////////////////////////////////////////////////////////////////////////
// STICKS
////////////////////////////////////////////////////////////////////////////////

function createStick(x){

    const stick = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25,0.25,0.2,32),
        wireMat
    );

    stick.rotation.x = Math.PI/2;

    stick.position.set(x,-0.15,0.55);

    controller.add(stick);

    return stick;
}

const leftStick = createStick(-0.8);
const rightStick = createStick(0.5);

////////////////////////////////////////////////////////////////////////////////
// TRIGGERS
////////////////////////////////////////////////////////////////////////////////

const l2 = new THREE.Mesh(
    new THREE.BoxGeometry(0.45,0.15,0.35),
    wireMat
);

l2.position.set(-1,0.7,-0.4);

controller.add(l2);

const r2 = l2.clone();

r2.position.x = 1;

controller.add(r2);

////////////////////////////////////////////////////////////////////////////////
// UI
////////////////////////////////////////////////////////////////////////////////

const status = document.getElementById("status");

const l2Fill = document.getElementById("l2Fill");
const r2Fill = document.getElementById("r2Fill");

////////////////////////////////////////////////////////////////////////////////
// HID
////////////////////////////////////////////////////////////////////////////////

let device = null;

////////////////////////////////////////////////////////////////////////////////
// GYRO VALUES
////////////////////////////////////////////////////////////////////////////////

let gyroX = 0;
let gyroY = 0;
let gyroZ = 0;

////////////////////////////////////////////////////////////////////////////////
// CONNECT
////////////////////////////////////////////////////////////////////////////////

document.getElementById("connectBtn").onclick = async ()=>{

    try{

        const devices = await navigator.hid.requestDevice({
            filters:[
                {
                    vendorId:0x054C
                }
            ]
        });

        if(devices.length === 0){

            status.innerHTML = "❌ Aucune manette";

            return;
        }

        device = devices[0];

        await device.open();

        status.innerHTML =
            "✅ " + device.productName;

        ////////////////////////////////////////////////////////////////////////////
        // INPUT REPORT
        ////////////////////////////////////////////////////////////////////////////

        device.addEventListener("inputreport", event=>{

            const data = event.data;

            ////////////////////////////////////////////////////////////////////////////
            // STICKS
            ////////////////////////////////////////////////////////////////////////////

            const lx = (data.getUint8(1)-128)/128;
            const ly = (data.getUint8(2)-128)/128;

            const rx = (data.getUint8(3)-128)/128;
            const ry = (data.getUint8(4)-128)/128;

            leftStick.position.x = -0.8 + lx*0.15;
            leftStick.position.y = -0.15 - ly*0.15;

            rightStick.position.x = 0.5 + rx*0.15;
            rightStick.position.y = -0.15 - ry*0.15;

            ////////////////////////////////////////////////////////////////////////////
            // TRIGGERS
            ////////////////////////////////////////////////////////////////////////////

            const l2Val = data.getUint8(5)/255;
            const r2Val = data.getUint8(6)/255;

            l2.rotation.x = -l2Val * 0.8;
            r2.rotation.x = -r2Val * 0.8;

            l2Fill.style.width = (l2Val*100)+"%";
            r2Fill.style.width = (r2Val*100)+"%";

            ////////////////////////////////////////////////////////////////////////////
            // GYROSCOPE
            ////////////////////////////////////////////////////////////////////////////

            // offsets DualSense USB
            // peut varier selon navigateur

            gyroX = data.getInt16(15,true) / 15000;
            gyroY = data.getInt16(17,true) / 15000;
            gyroZ = data.getInt16(19,true) / 15000;

        });

    }catch(err){

        console.error(err);

        status.innerHTML =
            "❌ Erreur connexion";
    }

};

////////////////////////////////////////////////////////////////////////////////
// ANIMATE
////////////////////////////////////////////////////////////////////////////////

function animate(){

    requestAnimationFrame(animate);

    ////////////////////////////////////////////////////////////////////////////
    // TRUE GYRO ROTATION
    ////////////////////////////////////////////////////////////////////////////

    controller.rotation.x += gyroY * 0.03;
    controller.rotation.y += gyroX * 0.03;
    controller.rotation.z += gyroZ * 0.03;

    renderer.render(scene,camera);
}

animate();

////////////////////////////////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////////////////////////////////

window.addEventListener("resize",()=>{

    camera.aspect =
        window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>
</body>
</html>
