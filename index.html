<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS5 DualSense Wireframe Monitor</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#050505;
    font-family:Arial;
    color:white;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:20px;
    left:20px;
    width:360px;

    background:rgba(0,0,0,0.55);
    border:1px solid #222;
    border-radius:18px;

    padding:20px;

    backdrop-filter:blur(20px);

    z-index:10;
}

#title{
    font-size:28px;
    margin-bottom:15px;
    color:#4da6ff;
    font-weight:bold;
}

#status{
    margin-bottom:15px;
    color:#999;
}

button{
    width:100%;
    height:50px;

    border:none;
    border-radius:12px;

    background:#1677ff;
    color:white;

    font-size:18px;
    cursor:pointer;

    transition:0.2s;
}

button:hover{
    transform:scale(1.02);
}

.section{
    margin-top:18px;
}

.label{
    color:#4da6ff;
    margin-bottom:5px;
}

.bar{
    width:100%;
    height:14px;
    background:#111;
    border-radius:999px;
    overflow:hidden;
    margin-bottom:10px;
}

.fill{
    height:100%;
    width:0%;
    background:#4da6ff;
    transition:0.05s;
}

.small{
    font-size:13px;
    color:#aaa;
}

</style>
</head>
<body>

<div id="ui">

    <div id="title">🎮 DualSense Monitor</div>

    <div id="status">
        Aucune manette connectée
    </div>

    <button id="connectBtn">
        Connecter la manette PS5
    </button>

    <div class="section">
        <div class="label">L2</div>
        <div class="bar">
            <div id="l2Fill" class="fill"></div>
        </div>

        <div class="label">R2</div>
        <div class="bar">
            <div id="r2Fill" class="fill"></div>
        </div>
    </div>

    <div class="section">
        <div class="small" id="buttonsInfo"></div>
    </div>

</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";

////////////////////////////////////////////////////////////////////////////////
// THREE JS
////////////////////////////////////////////////////////////////////////////////

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.z = 7;

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

document.body.appendChild(renderer.domElement);

////////////////////////////////////////////////////////////////////////////////
// LIGHT
////////////////////////////////////////////////////////////////////////////////

const light = new THREE.PointLight(0xffffff, 3);

light.position.set(5,5,5);

scene.add(light);

////////////////////////////////////////////////////////////////////////////////
// CONTROLLER GROUP
////////////////////////////////////////////////////////////////////////////////

const controller = new THREE.Group();

scene.add(controller);

////////////////////////////////////////////////////////////////////////////////
// MATERIALS
////////////////////////////////////////////////////////////////////////////////

const wireMat = new THREE.MeshBasicMaterial({
    color:0x4da6ff,
    wireframe:true
});

const whiteMat = new THREE.MeshBasicMaterial({
    color:0xffffff,
    wireframe:true
});

////////////////////////////////////////////////////////////////////////////////
// BODY
////////////////////////////////////////////////////////////////////////////////

const body = new THREE.Mesh(
    new THREE.BoxGeometry(3.3,1.2,1),
    wireMat
);

controller.add(body);

////////////////////////////////////////////////////////////////////////////////
// HANDLES
////////////////////////////////////////////////////////////////////////////////

function createHandle(x, rot){

    const handle = new THREE.Mesh(
        new THREE.CylinderGeometry(0.35,0.55,1.9,16),
        wireMat
    );

    handle.rotation.z = rot;
    handle.position.set(x,-1,0);

    controller.add(handle);
}

createHandle(-1.25,-0.5);
createHandle(1.25,0.5);

////////////////////////////////////////////////////////////////////////////////
// BUTTONS
////////////////////////////////////////////////////////////////////////////////

const buttons3D = {};

function createButton(name, x, y){

    const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.13,0.13,0.08,16),
        whiteMat.clone()
    );

    mesh.rotation.x = Math.PI/2;

    mesh.position.set(x,y,0.55);

    controller.add(mesh);

    buttons3D[name] = mesh;
}

createButton("cross",1.2,-0.05);
createButton("circle",1.45,0.2);
createButton("square",0.95,0.2);
createButton("triangle",1.2,0.45);

////////////////////////////////////////////////////////////////////////////////
// STICKS
////////////////////////////////////////////////////////////////////////////////

function createStick(x){

    const stick = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25,0.25,0.2,32),
        wireMat
    );

    stick.rotation.x = Math.PI/2;

    stick.position.set(x,-0.15,0.55);

    controller.add(stick);

    return stick;
}

const leftStick = createStick(-0.8);
const rightStick = createStick(0.5);

////////////////////////////////////////////////////////////////////////////////
// TRIGGERS
////////////////////////////////////////////////////////////////////////////////

const l2 = new THREE.Mesh(
    new THREE.BoxGeometry(0.45,0.15,0.35),
    wireMat
);

l2.position.set(-1,0.7,-0.4);

controller.add(l2);

const r2 = l2.clone();

r2.position.x = 1;

controller.add(r2);

////////////////////////////////////////////////////////////////////////////////
// UI
////////////////////////////////////////////////////////////////////////////////

const status = document.getElementById("status");

const l2Fill = document.getElementById("l2Fill");
const r2Fill = document.getElementById("r2Fill");

const buttonsInfo = document.getElementById("buttonsInfo");

////////////////////////////////////////////////////////////////////////////////
// HID
////////////////////////////////////////////////////////////////////////////////

let gamepad = null;

document.getElementById("connectBtn").onclick = async ()=>{

    try{

        const devices = await navigator.hid.requestDevice({
            filters:[
                {
                    vendorId:0x054C
                }
            ]
        });

        if(devices.length === 0){

            status.innerHTML = "❌ Aucune manette";

            return;
        }

        const device = devices[0];

        await device.open();

        status.innerHTML =
            "✅ " + device.productName;

        console.log(device);

    }catch(err){

        console.error(err);

        status.innerHTML =
            "❌ Erreur connexion";
    }

};

////////////////////////////////////////////////////////////////////////////////
// GAMEPAD API
////////////////////////////////////////////////////////////////////////////////

window.addEventListener("gamepadconnected",(e)=>{

    gamepad = e.gamepad;

    status.innerHTML =
        "✅ " + gamepad.id;

});

////////////////////////////////////////////////////////////////////////////////
// UPDATE
////////////////////////////////////////////////////////////////////////////////

function updateController(){

    const pads = navigator.getGamepads();

    if(!pads) return;

    const gp = pads[0];

    if(!gp) return;

    ////////////////////////////////////////////////////////////////////////////
    // STICKS
    ////////////////////////////////////////////////////////////////////////////

    const lx = gp.axes[0];
    const ly = gp.axes[1];

    const rx = gp.axes[2];
    const ry = gp.axes[3];

    leftStick.position.x = -0.8 + lx * 0.15;
    leftStick.position.y = -0.15 - ly * 0.15;

    rightStick.position.x = 0.5 + rx * 0.15;
    rightStick.position.y = -0.15 - ry * 0.15;

    ////////////////////////////////////////////////////////////////////////////
    // CONTROLLER ROTATION
    ////////////////////////////////////////////////////////////////////////////

    controller.rotation.y = lx * 0.4;
    controller.rotation.x = ly * 0.25;

    ////////////////////////////////////////////////////////////////////////////
    // BUTTONS
    ////////////////////////////////////////////////////////////////////////////

    const mapping = {
        0:"cross",
        1:"circle",
        2:"square",
        3:"triangle"
    };

    let html = "";

    for(let i=0;i<gp.buttons.length;i++){

        const val = gp.buttons[i].value;

        html += `
        Bouton ${i}: ${(val*100).toFixed(0)}%<br>
        `;

        if(mapping[i]){

            const mesh = buttons3D[mapping[i]];

            mesh.position.z = 0.55 - val * 0.15;

            mesh.material.color.setRGB(
                1,
                1 - val,
                1 - val
            );
        }
    }

    buttonsInfo.innerHTML = html;

    ////////////////////////////////////////////////////////////////////////////
    // L2 / R2
    ////////////////////////////////////////////////////////////////////////////

    const l2Val = gp.buttons[6].value;
    const r2Val = gp.buttons[7].value;

    l2.rotation.x = -l2Val * 0.7;
    r2.rotation.x = -r2Val * 0.7;

    l2Fill.style.width = (l2Val*100) + "%";
    r2Fill.style.width = (r2Val*100) + "%";

}

////////////////////////////////////////////////////////////////////////////////
// ANIMATE
////////////////////////////////////////////////////////////////////////////////

function animate(){

    requestAnimationFrame(animate);

    updateController();

    renderer.render(scene,camera);
}

animate();

////////////////////////////////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////////////////////////////////

window.addEventListener("resize",()=>{

    camera.aspect =
        window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>
</body>
</html>
